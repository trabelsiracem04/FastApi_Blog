{% extends "layout.html" %}
{% block content %}
	<div class="content-section py-3 px-4 mb-4">
		<h2 class="mb-3">Forgot your password?</h2>
		<p class="text-body-secondary mb-4">
			Enter the email address associated with your account and we will send you a password reset link.
		</p>
		<form id="forgotPasswordForm">
			<div class="mb-3">
				<label for="email" class="form-label">Email address</label>
				<input type="email"
					   class="form-control"
					   id="email"
					   name="email"
					   autocomplete="email"
					   required>
			</div>
			<button type="submit" class="btn btn-primary">Send reset link</button>
		</form>
		<p class="mt-3 mb-0">
			Remembered your password? <a href="{{ url_for('login') }}">Back to login</a>
		</p>
	</div>
{% endblock content %}
{% block scripts %}
	<script type="module">
		import { getErrorMessage, showModal } from '/static/js/utils.js';

		const forgotPasswordForm = document.getElementById('forgotPasswordForm');

		forgotPasswordForm.addEventListener('submit', async (event) => {
			event.preventDefault();

			const email = document.getElementById('email').value.trim();
			const submitButton = forgotPasswordForm.querySelector('button[type="submit"]');
			submitButton.disabled = true;

			try {
				const response = await fetch('/api/users/forgot-password', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ email }),
				});

				if (response.ok) {
					document.getElementById('successMessage').textContent =
						'If an account exists for that email, a password reset link has been sent.';
					forgotPasswordForm.reset();
					showModal('successModal');
				} else {
					const error = await response.json();
					document.getElementById('errorMessage').textContent = getErrorMessage(error);
					showModal('errorModal');
				}
			} catch (error) {
				document.getElementById('errorMessage').textContent =
					'Network error. Please check your connection and try again.';
				showModal('errorModal');
			} finally {
				submitButton.disabled = false;
			}
		});
	</script>
{% endblock scripts %}
