{% extends "layout.html" %}
{% block content %}
    <div class="content-section py-3 px-4 mb-4">
        <h2 class="mb-4">Create an account</h2>
        <div id="registrationMessage" class="alert d-none" role="alert"></div>
        <form id="registrationForm" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required minlength="1" maxlength="50">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required minlength="8" maxlength="200">
            </div>
            <button type="submit" class="btn btn-primary" id="registerButton">Register</button>
        </form>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">
        import { getErrorMessage } from '/static/js/utils.js';

        const registrationForm = document.getElementById('registrationForm');
        const registrationMessage = document.getElementById('registrationMessage');
        const registerButton = document.getElementById('registerButton');

        registrationForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            if (!registrationForm.checkValidity()) {
                registrationForm.classList.add('was-validated');
                return;
            }

            registerButton.disabled = true;
            registrationMessage.className = 'alert d-none';

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.fromEntries(new FormData(registrationForm).entries())),
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(getErrorMessage(error));
                }

                registrationMessage.textContent = 'Account created successfully.';
                registrationMessage.className = 'alert alert-success';
                registrationForm.reset();
                registrationForm.classList.remove('was-validated');
            } catch (error) {
                registrationMessage.textContent = error.message || 'Unable to create your account.';
                registrationMessage.className = 'alert alert-danger';
            } finally {
                registerButton.disabled = false;
            }
        });
    </script>
{% endblock scripts %}
